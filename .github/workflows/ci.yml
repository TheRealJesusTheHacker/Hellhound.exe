name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "visual-demo/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Headless demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxkbcommon0 libdbus-1-3 libegl1

      - name: Install demo and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-demo/requirements.txt pytest

      - name: Run headless tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  lint:
    name: Ruff + Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install linters
        run: python -m pip install --upgrade pip "ruff==0.17.0" "black==26.10.1"

      - name: Ruff
        run: ruff check visual-demo tests

      - name: Black
        run: black --check visual-demo tests
