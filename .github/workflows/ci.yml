name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "visual-demo/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - "HellHound.py"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "requirements-test.txt"
      - "requirements-test.lock.txt"
      - "requirements-lint.txt"
      - "requirements-lint.lock.txt"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Headless demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install system Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxkbcommon0 libdbus-1-3 libegl1

      - name: Install demo and test dependencies
        run: |
          # No pip self-upgrade: an unhashed self-upgrade would break
          # the hash-verified chain (fleet --require-hashes policy).
          # All installs below use the committed hash locks.
          pip install --require-hashes -r requirements-test.lock.txt

      - name: Run headless tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  lint:
    name: Ruff + Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install --require-hashes -r requirements-lint.lock.txt

      - name: Ruff
        run: ruff check visual-demo tests

      - name: Black
        run: black --check visual-demo tests

  root-tool:
    name: Root HellHound.py compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: |
          pip install --require-hashes -r requirements.lock.txt

      - name: Compile root tool
        run: python -m py_compile HellHound.py
