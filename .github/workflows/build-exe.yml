name: Build Hellhound.exe

on:
  release:
    types: [published]

# No workflow-level defaults: the build job below declares exactly the
# token permissions it needs (contents for release upload, id-token +
# attestations for build provenance). Everything else defaults to none.
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the token in the checkout's git config: this
          # job only needs API tokens (release upload + attestation use
          # GITHUB_TOKEN from the environment, not git credentials).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-demo/requirements.txt pyinstaller==6.22.3

      - name: Build Hellhound.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Hellhound --icon visual-demo/assets/hellhound.ico --add-data "visual-demo/assets/hellhound_logo.png;assets" visual-demo/hellhound_demo.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/Hellhound.exe
      - name: Attach Hellhound.exe to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/Hellhound.exe
