name: Build Hellhound.exe

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-demo/requirements.txt pyinstaller==6.22.3

      - name: Build Hellhound.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Hellhound --icon visual-demo/assets/hellhound.ico --add-data "visual-demo/assets/hellhound_logo.png;assets" visual-demo/hellhound_demo.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/Hellhound.exe
      - name: Attach Hellhound.exe to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/Hellhound.exe
