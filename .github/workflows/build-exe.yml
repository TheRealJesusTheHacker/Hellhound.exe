name: Build Hellhound.exe

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-demo/requirements.txt pyinstaller

      - name: Build Hellhound.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Hellhound --icon visual-demo/assets/hellhound.ico --add-data "visual-demo/assets/hellhound_logo.png;assets" visual-demo/hellhound_demo.py

      - name: Attach Hellhound.exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hellhound.exe
